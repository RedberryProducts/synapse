name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PHP ${{ matrix.php }} / SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        # Keep the SDK minimum aligned with composer.json's laravel/ai lower bound.
        sdk: ['1.3.0', 'latest']
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Use stable dependencies
        run: composer config minimum-stability stable
      - name: Install SDK minimum
        if: matrix.sdk != 'latest'
        run: composer update --with "laravel/ai:${{ matrix.sdk }}" --prefer-dist --no-interaction --no-progress
      - name: Install latest supported SDK
        if: matrix.sdk == 'latest'
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Report installed SDK
        run: composer show laravel/ai
      - name: Check code style, static analysis, and tests
        run: composer check

  assets:
    name: Compiled assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build assets
        run: npm run build
      - name: Verify committed assets are current
        run: git diff --exit-code -- dist/
